  <title>조선 시대 탐구 퀴즈</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #172a3a;
      --green: #123e38;
      --gold: #d39a38;
      --paper: #fffdf7;
      --coral: #bf5140;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-width: 0;
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }

    button { font-family: inherit; }

    .site-quiz-shell {
      width: 100%;
      min-width: 0;
      padding: 20px;
      background-image:
        radial-gradient(circle at 6% 4%, rgba(234, 203, 128, .6) 0 80px, transparent 81px),
        radial-gradient(circle at 98% 100%, rgba(156, 190, 177, .42) 0 115px, transparent 116px);
    }

    .quiz-frame {
      width: 100%;
      max-width: 940px;
      margin: 0 auto;
    }

    .hero-banner {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(250px, .75fr);
      overflow: hidden;
      border: 4px solid var(--green);
      border-radius: 24px;
      box-shadow: 7px 7px 0 rgba(18, 62, 56, .16);
    }

    .hero-copy {
      position: relative;
      min-width: 0;
      padding: 32px clamp(24px, 4vw, 48px);
      overflow: hidden;
      background: var(--green);
      color: #fff9eb;
    }

    .hero-copy::after {
      content: "朝鮮";
      position: absolute;
      right: 18px;
      bottom: -28px;
      color: rgba(255, 255, 255, .08);
      font-family: "Eczar", serif;
      font-size: 92px;
      line-height: 1;
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 13px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .hero-title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: "Eczar", "Noto Sans KR", serif;
      font-size: clamp(32px, 5vw, 50px);
      line-height: 1.12;
      letter-spacing: -.04em;
    }

    .hero-description {
      position: relative;
      z-index: 1;
      max-width: 510px;
      margin: 14px 0 0;
      line-height: 1.7;
      word-break: keep-all;
    }

    .hero-image {
      display: block;
      width: 100%;
      min-height: 230px;
      height: 100%;
      object-fit: cover;
      filter: saturate(.8) sepia(.12);
    }

    .quiz-area {
      width: 100%;
      margin-top: 24px;
      overflow: hidden;
      border: 1px solid rgba(23, 42, 58, .15);
      border-radius: 24px;
      background: rgba(255, 253, 247, .96);
      box-shadow: 0 14px 35px rgba(28, 46, 47, .11);
    }

    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 22px;
      border-bottom: 1px solid rgba(23, 42, 58, .13);
      background: #efe1c4;
    }

    .progress-dots {
      display: flex;
      flex-wrap: nowrap;
      gap: 7px;
      align-items: center;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border-radius: 50%;
      background: #c9b995;
      transition: background .2s ease, transform .2s ease;
    }

    .dot.current { background: var(--green); transform: scale(1.14); }
    .dot.done { background: var(--gold); }

    .scoreboard {
      margin: 0;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .question-panel,
    .result-screen {
      padding: clamp(26px, 5vw, 46px);
    }

    .question-panel[hidden],
    .result-screen[hidden],
    .feedback-variant[hidden],
    .action-button[hidden] {
      display: none;
    }

    .question-panel {
      animation: reveal .32s ease both;
    }

    .question-number {
      margin: 0 0 12px;
      color: #a35d14;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .question-title {
      margin: 0;
      font-size: clamp(22px, 3.3vw, 30px);
      font-weight: 800;
      line-height: 1.48;
      letter-spacing: -.035em;
      word-break: keep-all;
    }

    .answer-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 27px;
    }

    .answer-button {
      min-width: 0;
      min-height: 70px;
      padding: 14px 17px;
      border: 2px solid #d8cfbe;
      border-radius: 14px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      text-align: left;
      word-break: keep-all;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .answer-button:hover:not(:disabled) {
      border-color: var(--green);
      box-shadow: 0 4px 0 rgba(18, 62, 56, .13);
      transform: translateY(-2px);
    }

    .answer-button:disabled { cursor: default; }

    .answer-button.correct {
      border-color: #237765;
      background: #dff1e7;
      color: #154d41;
    }

    .answer-button.wrong {
      border-color: var(--coral);
      background: #fbe2dc;
      color: #80362a;
    }

    .feedback-box { margin-top: 21px; }

    .feedback-content {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      padding: 16px 17px;
      border-left: 5px solid #237765;
      border-radius: 12px;
      background: #e8f1ea;
      color: #17483d;
    }

    .feedback-content.wrong-feedback {
      border-left-color: var(--coral);
      background: #f9e8df;
      color: #723326;
    }

    .feedback-message {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.65;
      word-break: keep-all;
    }

    .next-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 23px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 11px 18px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .action-button:hover {
      box-shadow: 0 4px 0 rgba(23, 42, 58, .18);
      filter: brightness(1.04);
      transform: translateY(-2px);
    }

    .answer-button:focus-visible,
    .action-button:focus-visible {
      outline: 3px solid #e4a53d;
      outline-offset: 3px;
    }

    .result-screen {
      text-align: center;
      animation: reveal .35s ease both;
    }

    .result-medallion {
      display: grid;
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      place-items: center;
      border: 5px solid #fff7e4;
      border-radius: 50%;
      background: #e7bd61;
      box-shadow: 0 0 0 3px #bd7d22;
      color: var(--green);
    }

    .result-title {
      margin: 0;
      font-family: "Eczar", "Noto Sans KR", serif;
      font-size: clamp(29px, 5vw, 43px);
      line-height: 1.16;
    }

    .result-score {
      margin: 16px 0 8px;
      color: var(--green);
      font-size: clamp(40px, 8vw, 62px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.06em;
    }

    .result-message {
      max-width: 510px;
      margin: 14px auto 27px;
      color: #4a5860;
      font-size: 16px;
      line-height: 1.7;
      word-break: keep-all;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .site-quiz-shell { padding: 12px; }
      .hero-banner { grid-template-columns: 1fr; }
      .hero-image { min-height: 170px; max-height: 210px; }
      .status-strip { padding: 14px 16px; }
      .answer-list { grid-template-columns: 1fr; }
      .question-panel, .result-screen { padding: 27px 20px; }
    }
  </style>

    </section>
   </main>
  </div>
  <script src="/_sdk/78f4024a6883f001.editing_sdk.js" integrity="sha512-5JijBqhu1bO2WHWN6CyZm84Pau82MCFCPVSKnBzLACwT41OSljts3eUyyrStRqJcWxLvdOq8SRK/JTh6l0y70Q=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();

      const panels = Array.from(document.querySelectorAll(".question-panel"));
      const dots = Array.from(document.querySelectorAll(".dot"));
      let currentQuestion = 0;
      let score = 0;

      function updateStatus() {
        document.getElementById("progress-text").textContent = (currentQuestion + 1) + " / 5";
        document.getElementById("score-text").textContent = "점수 " + score + "점";

        dots.forEach(function (dot, index) {
          dot.classList.toggle("current", index === currentQuestion);
          dot.classList.toggle("done", index < currentQuestion);
        });
      }

      function showQuestion(index) {
        panels.forEach(function (panel, panelIndex) {
          panel.hidden = panelIndex !== index;
        });
        currentQuestion = index;
        updateStatus();
      }

      function selectAnswer(button) {
        const panel = button.closest(".question-panel");
        if (panel.dataset.answered === "true") return;

        const isCorrect = button.dataset.correct === "true";
        panel.dataset.answered = "true";

        panel.querySelectorAll(".answer-button").forEach(function (answer) {
          answer.disabled = true;
          if (answer.dataset.correct === "true") answer.classList.add("correct");
        });

        if (!isCorrect) button.classList.add("wrong");

        panel.querySelectorAll(".feedback-variant").forEach(function (feedback) {
          feedback.hidden = feedback.dataset.feedback !== (isCorrect ? "correct" : "wrong");
        });

        panel.querySelector(".action-button").hidden = false;
        if (isCorrect) score += 1;
        updateStatus();
      }

      function showResults() {
        panels.forEach(function (panel) { panel.hidden = true; });
        document.getElementById("result-screen").hidden = false;
        document.getElementById("final-score").textContent = score + " / 5";

        document.getElementById("result-perfect").hidden = score !== 5;
        document.getElementById("result-good").hidden = !(score >= 3 && score < 5);
        document.getElementById("result-review").hidden = score >= 3;

        dots.forEach(function (dot) {
          dot.classList.remove("current");
          dot.classList.add("done");
        });
      }

      function restartQuiz() {
        score = 0;
        currentQuestion = 0;
        document.getElementById("result-screen").hidden = true;

        panels.forEach(function (panel) {
          panel.dataset.answered = "false";
          panel.querySelectorAll(".feedback-variant").forEach(function (feedback) {
            feedback.hidden = true;
          });
          panel.querySelector(".action-button").hidden = true;
          panel.querySelectorAll(".answer-button").forEach(function (answer) {
            answer.disabled = false;
            answer.classList.remove("correct", "wrong");
          });
        });

        showQuestion(0);
      }

      document.querySelectorAll(".answer-button").forEach(function (button) {
        button.addEventListener("click", function () { selectAnswer(button); });
      });

      document.getElementById("next-1").addEventListener("click", function () { showQuestion(1); });
      document.getElementById("next-2").addEventListener("click", function () { showQuestion(2); });
      document.getElementById("next-3").addEventListener("click", function () { showQuestion(3); });
      document.getElementById("next-4").addEventListener("click", function () { showQuestion(4); });
      document.getElementById("show-result").addEventListener("click", showResults);
      document.getElementById("restart-button").addEventListener("click", restartQuiz);

      updateStatus();
    });
  </script>
 </body>
</html>
